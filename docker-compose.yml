# YMVA production stack. Start everything with:  ./ymva start
name: ymva

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ymva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ymva start to generate .env}
      POSTGRES_DB: ymva
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymva -d ymva"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Daily compressed database backups into ./backups, kept for 14 days.
  backup:
    <<: *defaults
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      PGHOST: postgres
      PGUSER: ymva
      PGDATABASE: ymva
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          file=/backups/auto-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --clean --if-exists | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file"; echo "backup saved: $$file"
          else
            rm -f "$$file.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'auto-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run ./ymva start to generate .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *defaults
    build: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://ymva:${POSTGRES_PASSWORD}@postgres:5432/ymva
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - recordings:/data/recordings
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 60s

  web:
    <<: *defaults
    build: ./web
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }

  caddy:
    <<: *defaults
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # Optional: free temporary public HTTPS address for testing real calls from this computer.
  # Started by `./ymva start --tunnel`.
  tunnel:
    <<: *defaults
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    depends_on:
      - caddy

volumes:
  recordings:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
