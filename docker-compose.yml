# YMVA production stack. Start everything with:  ./ymva start
name: ymva

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ymva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ymva start to generate .env}
      POSTGRES_DB: ymva
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymva -d ymva"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Daily compressed database backups into ./backups (kept 14 days), plus a copy of new call
  # recordings in ./backups/recordings.
  backup:
    <<: *defaults
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      PGHOST: postgres
      PGUSER: ymva
      PGDATABASE: ymva
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - recordings:/recordings:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          file=/backups/auto-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --clean --if-exists | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file"; echo "backup saved: $$file"
          else
            rm -f "$$file.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'auto-*.sql.gz' -mtime +14 -delete
          mkdir -p /backups/recordings && cp -Rpu /recordings/. /backups/recordings/ \
            && echo "recordings copied" || echo "recordings copy FAILED" >&2
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run ./ymva start to generate .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *defaults
    build: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://ymva:${POSTGRES_PASSWORD}@postgres:5432/ymva
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - recordings:/data/recordings
      - ./backups:/backups:ro  # read-only: so health checks can see the newest backup's age
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 60s

  web:
    <<: *defaults
    build:
      context: ./web
      # The n8n node is built into the web image and served at /downloads (see web/Dockerfile).
      additional_contexts:
        n8n-src: ./integrations/n8n-nodes-ymva
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }

  caddy:
    <<: *defaults
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # Optional: free temporary public HTTPS address for testing real calls from this computer.
  # Started by `./ymva start --tunnel`.
  tunnel:
    <<: *defaults
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    depends_on:
      - caddy

  # Steady test address for phone providers: ./ymva start --tunnel with NGROK_AUTHTOKEN and
  # NGROK_DOMAIN in .env (a free ngrok account includes one fixed domain).
  ngrok:
    <<: *defaults
    image: ngrok/ngrok:3.39.12-alpine
    profiles: ["ngrok"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "caddy:80", "--url", "https://${NGROK_DOMAIN:-unset}", "--log", "stdout"]
    depends_on:
      - caddy

  # Optional history graphs: ./ymva start --monitoring, then open Grafana through an SSH tunnel
  # (ssh -L 3001:localhost:3001 your-server) at http://localhost:3001.
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    # Prometheus can't read environment variables in its config: hand it the token as a file.
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf %s "$$METRICS_TOKEN" > /tmp/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=90d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *defaults
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"  # this server only
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  recordings:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
